<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      globalThis.import_meta_env = JSON.parse('"import_meta_env_placeholder"')
    </script>
    <script>
      // [wasl] 앞단 인증 프록시(oauth2-proxy) 세션이 끝나면 로그인으로 다시 보낸다.
      // 프록시는 /proxy · /backend 요청에 세션이 없으면 로그인 이동(302) 대신 401 을 준다(--api-route). 그래서 세션이 끝나면
      // 화면 안 요청만 조용히 실패한다("Proxy server may be unresponsive"). 같은 오리진 응답이 401 이면 /oauth2/auth 로 프록시
      // 세션을 확인하고, 끝났으면 /oauth2/start 로 보내 원래 경로로 돌아오게 한다. GraphQL 구독 웹소켓(/backend/graphql)은 업그레이드가
      // 거부돼도 401 이 보이지 않고 닫히기만 하므로, 같은 호스트 웹소켓이 정상 종료(1000)가 아닌 이유로 닫혀도 확인한다.
      // 탭이 다시 보일 때도 확인한다.
      // Hoppscotch 백엔드 자체의 401 은 /oauth2/auth 가 202 라 무시되고, 프록시가 없으면 /oauth2/auth 가 401 이 아니라 아무 일도 없다.
      // 확인은 CHECK_DELAY_MS 뒤에 한 번 보낸다. /oauth2/auth 도 프록시의 세션 갱신을 일으키는데 refresh token 은 한 번만 쓸 수 있어서,
      // 앱의 다른 요청과 동시에 나가면 갱신 경합으로 세션이 지워질 수 있다 - 진행 중인 요청이 끝나 새 쿠키를 받은 뒤에 확인한다.
      ;(function () {
        var origFetch = window.fetch
        var origOpen = XMLHttpRequest.prototype.open
        var KEY = "hopp_gate_relogin_at"
        var CHECK_DELAY_MS = 1500
        var checking = false

        function relogin() {
          try {
            // 로그인 직후 다시 401 이 나는 구성 오류에서 이동을 되풀이하지 않는다
            if (Date.now() - Number(sessionStorage.getItem(KEY) || 0) < 30000) return
            sessionStorage.setItem(KEY, String(Date.now()))
          } catch (e) {}
          location.assign(
            "/oauth2/start?rd=" +
              encodeURIComponent(location.pathname + location.search + location.hash)
          )
        }

        function check() {
          if (checking) return
          checking = true
          setTimeout(function () {
            origFetch
              .call(window, "/oauth2/auth", { credentials: "same-origin", cache: "no-store" })
              .then(function (r) {
                if (r.status === 401) relogin()
              })
              .catch(function () {})
              .then(function () {
                checking = false
              })
          }, CHECK_DELAY_MS)
        }

        function sameOrigin(u) {
          try {
            return new URL(u, location.href).origin === location.origin
          } catch (e) {
            return false
          }
        }

        function sameHost(u) {
          try {
            return new URL(u, location.href).host === location.host
          } catch (e) {
            return false
          }
        }

        window.fetch = function () {
          return origFetch.apply(this, arguments).then(function (r) {
            if (r.status === 401 && sameOrigin(r.url)) check()
            return r
          })
        }

        XMLHttpRequest.prototype.open = function (method, url) {
          this.addEventListener("loadend", function () {
            if (this.status === 401 && sameOrigin(this.responseURL || url)) check()
          })
          return origOpen.apply(this, arguments)
        }

        var OrigWS = window.WebSocket
        if (OrigWS) {
          window.WebSocket = class extends OrigWS {
            constructor(url, protocols) {
              super(url, protocols)
              if (sameHost(String(url))) {
                this.addEventListener("close", function (e) {
                  if (e.code !== 1000) check()
                })
              }
            }
          }
        }

        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") check()
        })
      })()
    </script>
    <title>Hoppscotch • Open source API development ecosystem</title>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" href="/icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Shims to make swagger-parser package work
      window.global = window
    </script>
    <script type="module">
      import { Buffer } from "buffer"
      import process from "process"

      // // Shims to make postman-collection work
      window.Buffer = Buffer
      window.process = process
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
